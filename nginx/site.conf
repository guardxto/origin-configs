# One site behind a reverse proxy or CDN. Include inside http {}, after realip.conf.
# Replace example.com, the certificate paths and the upstream address.

upstream app {
    server 127.0.0.1:3000;
    keepalive 32;                    # reuse connections to the application
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.25.1 and newer: write "listen 443 ssl;" and add "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/example.com.access.log realip;

    # Keep idle connections from the proxy open longer than the proxy keeps them,
    # so it never sends a request on a connection nginx is closing.
    keepalive_timeout 75s;

    # Add includeSubDomains and preload only when every subdomain serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static files the proxy and browsers may cache. An add_header in a location
    # replaces the ones from server {}, so HSTS is repeated here.
    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
        root /var/www/example.com;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # After the realip rewrite $remote_addr is the visitor. Pass exactly that,
        # not $proxy_add_x_forwarded_for, and let the application trust only nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
