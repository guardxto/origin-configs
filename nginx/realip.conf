# Restore the visitor's address behind a reverse proxy or CDN.
# Include inside http {}, before the server blocks.
#
# Trust only the addresses your proxy or CDN publishes. The ranges below are
# documentation examples: replace them with your provider's list, or let
# scripts/update-ranges.sh write them to a file you include here instead.
set_real_ip_from  192.0.2.0/24;      # proxy edge (example range)
set_real_ip_from  2001:db8::/32;     # proxy edge, IPv6 (example range)
# set_real_ip_from 10.0.0.5;         # your own load balancer, if there is one

real_ip_header    X-Forwarded-For;
real_ip_recursive on;                # skip every trusted hop, from the right

# After the rewrite $remote_addr is the visitor and $realip_remote_addr the
# proxy that connected. Logging the raw header too makes forgeries visible.
log_format realip '$remote_addr peer=$realip_remote_addr xff="$http_x_forwarded_for" '
                  '[$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
