# HAProxy behind a reverse proxy or CDN, in HTTP mode (HAProxy 2.2 or newer).
# The trusted list holds one address or CIDR range per line: your provider's
# published ranges. Replace the upstream address.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    # Keep idle connections from the proxy open longer than the proxy keeps them.
    timeout http-keep-alive 75s

frontend web
    bind :80
    # bind :443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1

    acl from_proxy src -f /etc/haproxy/trusted-proxies.lst

    http-request return status 200 content-type text/plain string "ok" if { path /healthz }

    # Order matters: decide on the connecting address first. After set-src,
    # src is the visitor, and an ACL on src would describe the visitor.
    # The deny line refuses requests that bypassed the proxy; the firewall
    # (firewall/origin-lock.nft) is the better place for that, this is a backstop.
    http-request deny deny_status 403 if !from_proxy
    http-request set-src hdr_ip(x-forwarded-for,-1) if from_proxy

    default_backend app

backend app
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-For %[src]
    server app1 127.0.0.1:3000
