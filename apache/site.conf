# One site behind a reverse proxy or CDN. Needs remoteip.conf and the modules
# remoteip, headers, ssl, proxy and proxy_http. Replace example.com, the
# certificate paths and the upstream address.

<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    SSLEngine on
    SSLCertificateFile    /etc/ssl/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    CustomLog ${APACHE_LOG_DIR}/example.com.access.log realip

    # Keep idle connections from the proxy open longer than the proxy keeps them.
    KeepAlive On
    KeepAliveTimeout 75

    # Add includeSubDomains and preload only when every subdomain serves HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000"

    <LocationMatch "\.(css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    # Pass the visitor's address as mod_remoteip restored it.
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
