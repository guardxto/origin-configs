# Apache httpd 2.4 behind a reverse proxy or CDN, with mod_remoteip.
# Enable the modules first (Debian, Ubuntu): a2enmod remoteip headers proxy proxy_http
# Then put this file in conf-available/ and run: a2enconf remoteip
#
# Trust only the addresses your proxy or CDN publishes. The ranges below are
# documentation examples: replace them with your provider's list.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 192.0.2.0/24
RemoteIPTrustedProxy 2001:db8::/32
# RemoteIPInternalProxy 10.0.0.5     # your own load balancer, if there is one

# %a is the visitor after mod_remoteip, %{c}a the proxy that connected.
LogFormat "%a peer=%{c}a xff=\"%{X-Forwarded-For}i\" %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" realip
